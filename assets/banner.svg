<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none" viewBox="0 0 1200 420"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>@keyframes floatOrb{0%{transform:translate(0,0) scale(1)}}@keyframes floatOrb2{0%{transform:translate(0,0) scale(1.1)}}@keyframes waveSlide{0%{transform:translateX(-50%)}}@keyframes pulseDot{0%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}.banner-container{position:relative;width:100%;height:420px;background:linear-gradient(135deg,#090d16 0,#0f172a 50%,#030712 100%);border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;padding:24px}.glow-orb-1{width:450px;height:450px;background:radial-gradient(circle,rgba(99,102,241,.28) 0,rgba(99,102,241,0) 70%);top:-120px;left:-80px;border-radius:50%;filter:blur(40px);animation:floatOrb 10s ease-in-out infinite alternate}.glow-orb-1,.glow-orb-2,.grid-bg{position:absolute;z-index:1}.glow-orb-2{width:500px;height:500px;background:radial-gradient(circle,rgba(168,85,247,.22) 0,rgba(236,72,153,0) 70%);bottom:-150px;right:-80px;border-radius:50%;filter:blur(45px);animation:floatOrb2 12s ease-in-out infinite alternate}.grid-bg{inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.03) 1px,transparent 1px);background-size:40px 40px;opacity:.6}.wave-line{position:absolute;width:200%;height:2px;background:linear-gradient(90deg,transparent,#38bdf8,#818cf8,#c084fc,transparent);top:75%;animation:waveSlide 8s linear infinite;opacity:.4;z-index:2}.content-layer{position:relative;z-index:10;max-width:960px;display:flex;flex-direction:column;align-items:center}.badge-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(99,102,241,.15);border:1px solid rgba(129,140,248,.4);color:#c7d2fe;font-size:13px;font-weight:600;padding:6px 16px;border-radius:9999px;margin-bottom:18px;letter-spacing:.5px;text-transform:uppercase}.pulse-dot{width:8px;height:8px;background-color:#38bdf8;border-radius:50%;box-shadow:0 0 10px #38bdf8;animation:pulseDot 2s infinite}.highlight,.title{-webkit-background-clip:text;-webkit-text-fill-color:transparent}.title{font-size:42px;font-weight:850;line-height:1.2;margin:0 0 14px;background:linear-gradient(135deg,#fff 30%,#cbd5e1 70%,#94a3b8 100%);letter-spacing:-1px}.highlight{background:linear-gradient(135deg,#38bdf8 0,#818cf8 50%,#c084fc 100%)}.subtitle{font-size:17px;line-height:1.5;color:#94a3b8;max-width:760px;margin:0 0 24px;font-weight:400}.features-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.feature-tag{background:rgba(15,23,42,.7);border:1px solid rgba(255,255,255,.12);color:#e2e8f0;font-size:13px;padding:7px 14px;border-radius:8px;font-weight:500;backdrop-filter:blur(8px)}</style><div class="banner-container"><div class="grid-bg"/><div class="glow-orb-1"/><div class="glow-orb-2"/><div class="wave-line"/><div class="content-layer"><div class="badge-pill"><span class="pulse-dot"/>Curated DevTools &amp; Agent Infrastructure</div><h1 class="title">Awesome<span class="highlight">AI-Generated API Docs</span></h1><p class="subtitle">Curated list of SaaS platforms, autonomous authoring agents, OpenAPI-to-Markdown pipelines, llms.txt generators, and open-source documentation stacks.</p><div class="features-row"><span class="feature-tag">🤖 Agentic Authoring</span><span class="feature-tag">📄 OpenAPI &amp; Swagger</span><span class="feature-tag">⚡ llms.txt &amp; AGENTS.md</span><span class="feature-tag">🔌 Model Context Protocol (MCP)</span><span class="feature-tag">🌟 Top Open-Source Repos</span></div></div></div></div></foreignObject></svg>