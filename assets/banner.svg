<svg fill="none" viewBox="0 0 1200 420" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .banner-container {
          position: relative;
          width: 100%;
          height: 420px;
          background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #030712 100%);
          border-radius: 16px;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          box-sizing: border-box;
          padding: 24px;
        }

        /* Ambient Dynamic Glow Orbs in Background */
        .glow-orb-1 {
          position: absolute;
          width: 450px;
          height: 450px;
          background: radial-gradient(circle, rgba(99, 102, 241, 0.28) 0%, rgba(99, 102, 241, 0) 70%);
          top: -120px;
          left: -80px;
          border-radius: 50%;
          filter: blur(40px);
          animation: floatOrb 10s ease-in-out infinite alternate;
          z-index: 1;
        }

        .glow-orb-2 {
          position: absolute;
          width: 500px;
          height: 500px;
          background: radial-gradient(circle, rgba(168, 85, 247, 0.22) 0%, rgba(236, 72, 153, 0) 70%);
          bottom: -150px;
          right: -80px;
          border-radius: 50%;
          filter: blur(45px);
          animation: floatOrb2 12s ease-in-out infinite alternate;
          z-index: 1;
        }

        .grid-bg {
          position: absolute;
          inset: 0;
          background-image: 
            linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
          background-size: 40px 40px;
          z-index: 1;
          opacity: 0.6;
        }

        /* Animated Pulsing Flow Wave Line */
        .wave-line {
          position: absolute;
          width: 200%;
          height: 2px;
          background: linear-gradient(90deg, transparent, #38bdf8, #818cf8, #c084fc, transparent);
          top: 75%;
          animation: waveSlide 8s linear infinite;
          opacity: 0.4;
          z-index: 2;
        }

        @keyframes floatOrb {
          0% { transform: translate(0, 0) scale(1); }
          100% { transform: translate(60px, 40px) scale(1.15); }
        }

        @keyframes floatOrb2 {
          0% { transform: translate(0, 0) scale(1.1); }
          100% { transform: translate(-50px, -35px) scale(0.95); }
        }

        @keyframes waveSlide {
          0% { transform: translateX(-50%); }
          100% { transform: translateX(0%); }
        }

        /* Foreground Content - High Z-Index ensures clear visibility */
        .content-layer {
          position: relative;
          z-index: 10;
          max-width: 960px;
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .badge-pill {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: rgba(99, 102, 241, 0.15);
          border: 1px solid rgba(129, 140, 248, 0.4);
          color: #c7d2fe;
          font-size: 13px;
          font-weight: 600;
          padding: 6px 16px;
          border-radius: 9999px;
          margin-bottom: 18px;
          letter-spacing: 0.5px;
          text-transform: uppercase;
        }

        .pulse-dot {
          width: 8px;
          height: 8px;
          background-color: #38bdf8;
          border-radius: 50%;
          box-shadow: 0 0 10px #38bdf8;
          animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.4; transform: scale(0.8); }
        }

        .title {
          font-size: 42px;
          font-weight: 850;
          line-height: 1.2;
          margin: 0 0 14px 0;
          background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 70%, #94a3b8 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          letter-spacing: -1px;
        }

        .highlight {
          background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .subtitle {
          font-size: 17px;
          line-height: 1.5;
          color: #94a3b8;
          max-width: 760px;
          margin: 0 0 24px 0;
          font-weight: 400;
        }

        .features-row {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 10px;
        }

        .feature-tag {
          background: rgba(15, 23, 42, 0.7);
          border: 1px solid rgba(255, 255, 255, 0.12);
          color: #e2e8f0;
          font-size: 13px;
          padding: 7px 14px;
          border-radius: 8px;
          font-weight: 500;
          backdrop-filter: blur(8px);
        }
      </style>

      <div class="banner-container">
        <div class="grid-bg"></div>
        <div class="glow-orb-1"></div>
        <div class="glow-orb-2"></div>
        <div class="wave-line"></div>

        <div class="content-layer">
          <div class="badge-pill">
            <span class="pulse-dot"></span>
            Curated DevTools &amp; Agent Infrastructure
          </div>
          <h1 class="title">Awesome <span class="highlight">AI-Generated API Docs</span></h1>
          <p class="subtitle">
            Curated list of SaaS platforms, autonomous authoring agents, OpenAPI-to-Markdown pipelines, llms.txt generators, and open-source documentation stacks.
          </p>
          <div class="features-row">
            <span class="feature-tag">🤖 Agentic Authoring</span>
            <span class="feature-tag">📄 OpenAPI &amp; Swagger</span>
            <span class="feature-tag">⚡ llms.txt &amp; AGENTS.md</span>
            <span class="feature-tag">🔌 Model Context Protocol (MCP)</span>
            <span class="feature-tag">🌟 Top Open-Source Repos</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
